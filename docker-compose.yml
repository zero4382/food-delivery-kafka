services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  setup:
    build: .
    command: ["node", "src/setup.js"]
    environment:
      KAFKA_BROKER: broker:19092
      NODE_NO_WARNINGS: 1
    depends_on:
      broker:
        condition: service_healthy

  order-service:
    build: .
    environment:
      KAFKA_BROKER: broker:19092
      PORT: 3000
      NODE_NO_WARNINGS: 1
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

  customer-consumer:
    build: .
    command: ["node", "src/consumer.js"]
    environment:
      KAFKA_BROKER: broker:19092
      SERVICE_NAME: customer
      GROUP_ID: customer-service
      NODE_NO_WARNINGS: 1
    depends_on:
      setup:
        condition: service_completed_successfully

  rider-consumer:
    build: .
    command: ["node", "src/consumer.js"]
    environment:
      KAFKA_BROKER: broker:19092
      SERVICE_NAME: rider
      GROUP_ID: rider-service
      NODE_NO_WARNINGS: 1
    depends_on:
      setup:
        condition: service_completed_successfully

  notification-consumer:
    build: .
    command: ["node", "src/consumer.js"]
    environment:
      KAFKA_BROKER: broker:19092
      SERVICE_NAME: notification
      GROUP_ID: notification-service
      NODE_NO_WARNINGS: 1
    depends_on:
      setup:
        condition: service_completed_successfully
